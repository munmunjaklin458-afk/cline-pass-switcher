services:
  cline-pass-console:
    build: .
    container_name: cline-pass-console
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - PROXY_KEY=${PROXY_KEY:-}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3123:3123"
